<!DOCTYPE html>
<html>
<head>
    <title>SITP</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 500px; width: 100%; }
    </style>
</head>
<body>

    <select id="s">
        <option value="">Seleccione</option>
        <option value="4.7437,-74.0837">Suba</option>
        <option value="sitp">SITP</option>
    </select>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([4.639, -74.082], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        let ly;

        document.getElementById('s').onchange = function() {
            let v = this.value;
            if (v.includes(',')) {
                map.flyTo(v.split(','), 14);
            } else if (v === 'sitp') {
                fetch('paradero_zonal.geojson')
                    .then(r => r.json())
                    .then(d => {
                        if (ly) map.removeLayer(ly);
                        ly = L.geoJSON(d, {
                            style: { color: 'blue', weight: 2 }
                        }).addTo(map);
                        map.fitBounds(ly.getBounds());
                    });
            }
        };
    </script>
</body>
</html>
