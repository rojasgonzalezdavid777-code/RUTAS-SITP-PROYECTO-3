<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>RUTAS SITP</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="styles.css">

<style>
html, body {
    margin: 0;
    padding: 0;
}

#map {
    height: 90vh;
    width: 100%;
}
</style>

</head>

<body>

<h1>LISTA DE DESPLEGABLES</h1>

<select id="select-location">
    <option value="-1">Seleccione una opción</option>
    <option value="4.7437,-74.0837">Localidad Suba</option>
    <option value="sitp">Rutas SITP</option>
</select>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Crear mapa
let map = L.map("map").setView([4.63986, -74.082412], 11);

// Capa base
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

let rutasLayer;

// Evento del select
document.getElementById("select-location")
.addEventListener("change", function(){

    let value = this.value;

    // Mover a Suba
    if(value.includes(",")){
        let [lat, lng] = value.split(",").map(Number);
        map.flyTo([lat, lng], 13);
    }

    // Cargar SITP (archivo debe estar en la misma carpeta)
    if(value === "sitp"){

        fetch("paradero_zonal.geojson")
        .then(res => res.json())
        .then(data => {

            if(rutasLayer){
                map.removeLayer(rutasLayer);
            }

            rutasLayer = L.geoJSON(data, {
                style:{ color:"blue", weight:2 }
            }).addTo(map);

            map.fitBounds(rutasLayer.getBounds());

        })
        .catch(err => console.log("Error cargando GeoJSON:", err));
    }

});

</script>

</body>
</html>
